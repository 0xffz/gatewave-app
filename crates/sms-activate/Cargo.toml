[package]
name = "sms-activate"
version = "1.0.0"
edition = "2024"
description = "Virtual-number provider clients behind one trait: sms-activate-compatible dialects (Hero-SMS, SMSBower, Tiger SMS) and 5SIM's REST API"
license = "MIT OR Apache-2.0"

[features]
default = ["ureq"]
ureq = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3.4", optional = true }

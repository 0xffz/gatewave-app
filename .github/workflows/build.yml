name: Build applications

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-universal:
    name: macOS Universal
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/gatewave \
            target/x86_64-apple-darwin/release/gatewave \
            -output target/gatewave-universal

      - name: Package application bundle
        run: |
          make app \
            CARGO=/usr/bin/true \
            RELEASE_BIN="$PWD/target/aarch64-apple-darwin/release/gatewave"
          cp target/gatewave-universal dist/Gatewave.app/Contents/MacOS/gatewave
          codesign --force --deep --sign - dist/Gatewave.app
          lipo dist/Gatewave.app/Contents/MacOS/gatewave -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/Gatewave.app
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Gatewave.app Gatewave-macos-universal.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Gatewave-macos-universal
          path: Gatewave-macos-universal.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x86-64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build application
        run: cargo build --locked --release

      - name: Package application
        shell: pwsh
        run: Compress-Archive -Path target\release\gatewave.exe -DestinationPath Gatewave-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Gatewave-windows-x86_64
          path: Gatewave-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos-universal
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v8
        with:
          pattern: Gatewave-*
          path: release
          merge-multiple: true

      - name: Create release and upload applications
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
